<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Enterprise Dashboard</title>
  
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'system-ui', 'sans-serif'] },
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
            surface: '#f8fafc'
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-surface text-slate-800 font-sans antialiased" x-data="erpApp()" x-init="initApp()">

  <!-- Toast Notification -->
  <div x-show="toast.show" x-transition.duration.300ms class="fixed top-5 left-5 z-[60] flex items-center gap-3 px-5 py-3 rounded-lg shadow-xl border backdrop-blur-md"
       :class="toast.type === 'success' ? 'bg-emerald-50/90 border-emerald-200 text-emerald-800' : 'bg-rose-50/90 border-rose-200 text-rose-800'" x-cloak>
    <i class="fas" :class="toast.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
    <span class="font-semibold text-sm" x-text="toast.message"></span>
  </div>

  <div class="flex h-screen overflow-hidden">
    
    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex w-64 bg-slate-900 text-white flex-col shadow-2xl z-20">
      <div class="p-5 border-b border-slate-700 flex items-center gap-3">
        <div class="w-9 h-9 bg-primary-600 rounded-lg flex items-center justify-center text-lg shadow-lg shadow-primary-500/30">💎</div>
        <div>
          <h1 class="font-bold text-base tracking-wide">ERP Enterprise</h1>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider">v7.3 Professional</p>
        </div>
      </div>
      
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <template x-for="item in menuItems" :key="item.id">
          <button @click="currentTab = item.id; if(window.innerWidth < 768) mobileMenuOpen = false" 
                  :class="currentTab === item.id ? 'bg-primary-600 text-white shadow-lg shadow-primary-900/20' : 'text-slate-400 hover:bg-slate-800 hover:text-white'" 
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 text-sm font-medium">
            <i :class="item.icon" class="w-5 text-center"></i>
            <span x-text="item.label"></span>
          </button>
        </template>
      </nav>

      <div class="p-4 border-t border-slate-700">
        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
          <div class="flex items-center gap-2 mb-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-xs font-semibold text-emerald-400">سیستم پایدار</span>
          </div>
          <p class="text-[10px] text-slate-500">آخرین همگام‌سازی: <span x-text="dashboardData.lastUpdate"></span></p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
      
      <!-- Top Bar -->
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 shadow-sm z-10">
        <div class="flex items-center gap-4">
          <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
            <i class="fas fa-bars text-xl"></i>
          </button>
          <h2 class="text-lg font-bold text-slate-800" x-text="menuItems.find(m => m.id === currentTab)?.label"></h2>
        </div>
        <div class="flex items-center gap-3">
          <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-full relative">
            <i class="fas fa-bell"></i>
            <span x-show="dashboardData.suspenseCount > 0" class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white"></span>
          </button>
          <div class="w-9 h-9 bg-primary-100 text-primary-700 rounded-full flex items-center justify-center font-bold border border-primary-200 text-sm">
            <i class="fas fa-user"></i>
          </div>
        </div>
      </header>

      <!-- Mobile Menu Overlay -->
      <div x-show="mobileMenuOpen" class="fixed inset-0 bg-black/50 z-30 md:hidden" @click="mobileMenuOpen = false" x-transition.opacity></div>
      <div x-show="mobileMenuOpen" class="fixed inset-y-0 right-0 w-64 bg-slate-900 z-40 md:hidden transform transition-transform duration-300" 
           :class="mobileMenuOpen ? 'translate-x-0' : 'translate-x-full'">
         <div class="p-5 border-b border-slate-700 text-white font-bold">ERP Enterprise</div>
         <nav class="p-3 space-y-1">
            <template x-for="item in menuItems" :key="item.id">
              <button @click="currentTab = item.id; mobileMenuOpen = false" 
                      :class="currentTab === item.id ? 'bg-primary-600 text-white' : 'text-slate-400'" 
                      class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                <i :class="item.icon" class="w-5 text-center"></i>
                <span x-text="item.label"></span>
              </button>
            </template>
         </nav>
      </div>

      <!-- Scrollable Content Area -->
      <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-surface">
        
        <!-- VIEW: DASHBOARD -->
        <div x-show="currentTab === 'dashboard'" class="fade-in space-y-6" x-cloak>
          <!-- Metrics Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
            <template x-for="metric in metrics" :key="metric.id">
              <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300">
                <div class="flex justify-between items-start mb-4">
                  <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide" x-text="metric.title"></p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="metric.value"></h3>
                  </div>
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center text-lg" :class="metric.bgClass + ' ' + metric.textClass">
                    <i :class="metric.icon"></i>
                  </div>
                </div>
                <div class="flex items-center gap-2 text-xs">
                  <span :class="metric.trend > 0 ? 'text-emerald-600' : 'text-rose-600'" class="font-bold flex items-center gap-1">
                    <i :class="metric.trend > 0 ? 'fa-arrow-up' : 'fa-arrow-down'"></i>
                    <span x-text="Math.abs(metric.trend) + '%'"></span>
                  </span>
                  <span class="text-slate-400">نسبت به ماه قبل</span>
                </div>
              </div>
            </template>
          </div>

          <!-- Chart & Recent Activity -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Chart -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
              <h3 class="text-base font-bold text-slate-800 mb-4">روند فعالیت‌های هفتگی</h3>
              <div class="relative h-64 w-full">
                <canvas id="activityChart"></canvas>
              </div>
            </div>

            <!-- Recent Activity Mini List -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
              <h3 class="text-base font-bold text-slate-800 mb-4">فعالیت‌های اخیر</h3>
              <div class="space-y-4">
                <template x-if="isLoadingRecent">
                  <template x-for="i in 4">
                    <div class="flex items-center gap-3 animate-pulse">
                      <div class="w-8 h-8 bg-slate-200 rounded-full"></div>
                      <div class="flex-1 space-y-2">
                        <div class="h-3 bg-slate-200 rounded w-3/4"></div>
                        <div class="h-2 bg-slate-200 rounded w-1/2"></div>
                      </div>
                    </div>
                  </template>
                </template>
                <template x-for="tx in recentTransactions.slice(0, 5)" :key="tx.id">
                  <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 transition-colors">
                    <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm" :class="'bg-' + tx.color + '-100 text-' + tx.color + '-600'">
                      <i :class="'fas ' + tx.icon"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm font-semibold text-slate-800 truncate" x-text="tx.type + ' - ' + tx.code"></p>
                      <p class="text-xs text-slate-500" x-text="tx.date + ' | مقدار: ' + tx.qty"></p>
                    </div>
                  </div>
                </template>
                <template x-if="!isLoadingRecent && recentTransactions.length === 0">
                  <p class="text-sm text-slate-400 text-center py-4">هیچ فعالیتی ثبت نشده است.</p>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- VIEW: NEW TRANSACTION -->
        <div x-show="currentTab === 'new_transaction'" class="fade-in max-w-4xl mx-auto" x-cloak>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
              <div>
                <h3 class="text-lg font-bold text-slate-800">ثبت عملیات جدید</h3>
                <p class="text-sm text-slate-500 mt-1">اطلاعات را با دقت وارد کنید. تغییرات پس از ثبت در گزارشات اعمال می‌شود.</p>
              </div>
              <button @click="resetForm()" class="text-sm text-primary-600 hover:text-primary-800 font-medium flex items-center gap-1">
                <i class="fas fa-redo"></i> پاک کردن فرم
              </button>
            </div>
            
            <div class="p-6 md:p-8">
              <!-- Type Selector -->
              <div class="mb-8">
                <label class="block text-sm font-bold text-slate-700 mb-2">نوع عملیات <span class="text-rose-500">*</span></label>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                  <template x-for="(config, key) in formConfig" :key="key">
                    <button type="button" @click="selectedType = key; loadFormFields()" 
                            :class="selectedType === key ? 'ring-2 ring-primary-500 bg-primary-50 border-primary-500 text-primary-700' : 'border-slate-200 hover:border-primary-300 hover:bg-slate-50'"
                            class="flex flex-col items-center justify-center p-4 rounded-xl border transition-all duration-200 gap-2">
                      <i :class="config.icon || 'fas fa-file'" class="text-xl mb-1"></i>
                      <span class="text-sm font-semibold" x-text="config.label"></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Dynamic Form -->
              <form @submit.prevent="submitData" x-show="selectedType" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <template x-for="field in currentFields" :key="field.name">
                    <div>
                      <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        <span x-text="field.label"></span>
                        <span x-show="field.required" class="text-rose-500">*</span>
                      </label>
                      
                      <template x-if="field.type === 'datalist'">
                        <div class="relative">
                          <input :id="field.name" type="text" x-model="formData[field.name]" :required="field.required" :list="'dl_' + field.name"
                                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all text-sm">
                          <datalist :id="'dl_' + field.name">
                            <template x-for="item in existingItems" :key="item"><option :value="item"></option></template>
                          </datalist>
                          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        </div>
                      </template>

                      <template x-if="field.type !== 'datalist'">
                        <input :id="field.name" :type="field.type" :required="field.required" :step="field.type === 'number' ? 'any' : null"
                               x-model="formData[field.name]"
                               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all text-sm">
                      </template>
                    </div>
                  </template>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                  <button type="button" @click="currentTab = 'dashboard'" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 font-medium hover:bg-slate-50 transition-colors text-sm">
                    انصراف
                  </button>
                  <button type="submit" :disabled="isSubmitting" class="px-6 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold transition-all duration-200 flex items-center gap-2 shadow-lg shadow-primary-500/20 text-sm">
                    <i x-show="isSubmitting" class="fas fa-circle-notch fa-spin"></i>
                    <span x-text="isSubmitting ? 'در حال پردازش...' : 'ثبت نهایی در سیستم'"></span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- VIEW: TRANSACTIONS TABLE -->
        <div x-show="currentTab === 'transactions'" class="fade-in space-y-4" x-cloak>
          <!-- Toolbar -->
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
              <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input type="text" x-model="searchQuery" placeholder="جستجو در کد کالا، نوع عملیات..." 
                     class="w-full pr-10 pl-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
            </div>
            <div class="flex gap-2 w-full md:w-auto">
              <select x-model="filterType" class="px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                <option value="all">همه عملیات‌ها</option>
                <option value="خرید">خرید</option>
                <option value="فروش">فروش</option>
                <option value="تولید">تولید</option>
                <option value="ضایعات">ضایعات</option>
              </select>
              <button @click="loadRecentData()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-sync-alt" :class="isLoadingRecent ? 'fa-spin' : ''"></i>
              </button>
            </div>
          </div>

          <!-- Data Table -->
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-right">
                <thead class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <tr>
                    <th class="px-6 py-4">نوع</th>
                    <th class="px-6 py-4">تاریخ</th>
                    <th class="px-6 py-4">کد کالا / محصول</th>
                    <th class="px-6 py-4">مقدار</th>
                    <th class="px-6 py-4">وضعیت</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <!-- Skeleton Loader -->
                  <template x-if="isLoadingRecent">
                    <template x-for="i in 5">
                      <tr>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-16 skeleton"></div></td>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-20 skeleton"></div></td>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-32 skeleton"></div></td>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-12 skeleton"></div></td>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-16 skeleton"></div></td>
                      </tr>
                    </template>
                  </template>

                  <!-- Data Rows -->
                  <template x-for="tx in filteredTransactions" :key="tx.id">
                    <tr class="hover:bg-slate-50/80 transition-colors">
                      <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs" :class="'bg-' + tx.color + '-100 text-' + tx.color + '-600'">
                            <i :class="'fas ' + tx.icon"></i>
                          </div>
                          <span class="font-medium text-slate-800" x-text="tx.type"></span>
                        </div>
                      </td>
                      <td class="px-6 py-4 text-slate-600" x-text="tx.date"></td>
                      <td class="px-6 py-4 font-mono text-slate-700" x-text="tx.code"></td>
                      <td class="px-6 py-4 font-semibold text-slate-800" x-text="tx.qty"></td>
                      <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                          ثبت شده
                        </span>
                      </td>
                    </tr>
                  </template>

                  <!-- Empty State -->
                  <template x-if="!isLoadingRecent && filteredTransactions.length === 0">
                    <tr>
                      <td colspan="5" class="px-6 py-12 text-center">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400 text-2xl">
                          <i class="fas fa-inbox"></i>
                        </div>
                        <p class="text-slate-500 font-medium">موردی یافت نشد</p>
                        <p class="text-slate-400 text-xs mt-1">فیلترهای جستجو را تغییر دهید یا عملیات جدیدی ثبت کنید.</p>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <!-- Pagination (Mock) -->
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs text-slate-500">
              <span x-text="'نمایش ' + filteredTransactions.length + ' مورد'"></span>
              <div class="flex gap-1">
                <button class="px-3 py-1 rounded border border-slate-300 bg-white disabled:opacity-50" disabled>قبلی</button>
                <button class="px-3 py-1 rounded border border-slate-300 bg-white disabled:opacity-50" disabled>بعدی</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    function erpApp() {
      return {
        currentTab: 'dashboard',
        mobileMenuOpen: false,
        isLoadingRecent: true,
        isSubmitting: false,
        searchQuery: '',
        filterType: 'all',
        
        menuItems: [
          { id: 'dashboard', label: 'داشبورد مدیریتی', icon: 'fa-chart-pie' },
          { id: 'new_transaction', label: 'ثبت عملیات جدید', icon: 'fa-plus-circle' },
          { id: 'transactions', label: 'سابقه تراکنش‌ها', icon: 'fa-list' }
        ],
        
        formConfig: {
          'PURCHASE': { label: 'خرید', icon: 'fa-shopping-cart', sheetName: 'PURCHASES', fields: [{name:'date',label:'تاریخ',type:'date',required:true},{name:'itemCode',label:'کد کالا',type:'datalist',required:true},{name:'qty',label:'مقدار',type:'number',required:true},{name:'unit',label:'واحد',type:'text',required:true},{name:'totalCost',label:'بهای کل',type:'number',required:true}] },
          'SALE': { label: 'فروش', icon: 'fa-cash-register', sheetName: 'SALES', fields: [{name:'date',label:'تاریخ',type:'date',required:true},{name:'itemCode',label:'کد کالا',type:'datalist',required:true},{name:'qty',label:'مقدار',type:'number',required:true}] },
          'PRODUCTION': { label: 'تولید', icon: 'fa-industry', sheetName: 'PRODUCTION', fields: [{name:'date',label:'تاریخ',type:'date',required:true},{name:'menuCode',label:'کد محصول',type:'datalist',required:true},{name:'qtyProduced',label:'تعداد',type:'number',required:true}] },
          'WASTE': { label: 'ضایعات', icon: 'fa-trash', sheetName: 'WASTE', fields: [{name:'date',label:'تاریخ',type:'date',required:true},{name:'itemCode',label:'کد کالا',type:'datalist',required:true},{name:'qty',label:'مقدار',type:'number',required:true},{name:'unit',label:'واحد',type:'text',required:true}] }
        },

        existingItems: [],
        selectedType: '',
        currentFields: [],
        formData: {},
        
        dashboardData: { totalValue: '0', suspenseCount: 0, itemCount: 0, lastUpdate: '-' },
        metrics: [
          { id: 1, title: 'ارزش کل انبار', value: '0 ریال', icon: 'fa-warehouse', bgClass: 'bg-blue-50', textClass: 'text-blue-600', trend: 12 },
          { id: 2, title: 'هشدارهای تعلیقی', value: '0 مورد', icon: 'fa-exclamation-triangle', bgClass: 'bg-rose-50', textClass: 'text-rose-600', trend: -5 },
          { id: 3, title: 'اقلام فعال', value: '0 قلم', icon: 'fa-boxes', bgClass: 'bg-purple-50', textClass: 'text-purple-600', trend: 8 },
          { id: 4, title: 'تراکنش‌های امروز', value: '0 مورد', icon: 'fa-receipt', bgClass: 'bg-emerald-50', textClass: 'text-emerald-600', trend: 24 }
        ],
        
        recentTransactions: [],
        toast: { show: false, message: '', type: 'success' },
        chartInstance: null,

        async initApp() {
          await this.loadDashboardData();
          await this.loadRecentData();
          this.initChart();
        },

        async loadDashboardData() {
          try {
            const res = await this.gasCall('getDashboardSummary');
            this.dashboardData = res;
            this.metrics[0].value = res.totalValue + ' ریال';
            this.metrics[1].value = res.suspenseCount + ' مورد';
            this.metrics[2].value = res.itemCount + ' قلم';
          } catch (e) { console.error(e); }
        },

        async loadRecentData() {
          this.isLoadingRecent = true;
          try {
            this.recentTransactions = await this.gasCall('getRecentTransactions', 50);
          } catch (e) { console.error(e); }
          finally { this.isLoadingRecent = false; }
        },

        get filteredTransactions() {
          return this.recentTransactions.filter(tx => {
            const matchesSearch = tx.code.toLowerCase().includes(this.searchQuery.toLowerCase()) || tx.type.includes(this.searchQuery);
            const matchesFilter = this.filterType === 'all' || tx.type === this.filterType;
            return matchesSearch && matchesFilter;
          });
        },

        loadFormFields() {
          if (!this.selectedType) return;
          this.currentFields = this.formConfig[this.selectedType].fields;
          this.formData = {};
          if (this.existingItems.length === 0) {
            this.gasCall('getUiConfig').then(res => { this.existingItems = res.items; });
          }
        },

        async submitData() {
          this.isSubmitting = true;
          const payload = { type: this.formConfig[this.selectedType].sheetName, ...this.formData };
          try {
            await this.gasCall('processFormData', payload);
            this.showToast('✅ عملیات با موفقیت در سیستم ثبت گردید.', 'success');
            this.resetForm();
            await this.loadDashboardData();
            await this.loadRecentData();
            this.currentTab = 'transactions';
          } catch (e) {
            this.showToast('❌ خطا: ' + e.message, 'error');
          } finally {
            this.isSubmitting = false;
          }
        },

        resetForm() {
          this.selectedType = '';
          this.currentFields = [];
          this.formData = {};
        },

        showToast(message, type) {
          this.toast = { show: true, message: message, type: type };
          setTimeout(() => { this.toast.show = false; }, 4000);
        },

        initChart() {
          setTimeout(() => {
            const ctx = document.getElementById('activityChart');
            if (!ctx) return;
            
            this.gasCall('getChartMetrics').then(data => {
              if (this.chartInstance) this.chartInstance.destroy();
              
              this.chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: data.labels,
                  datasets: data.datasets.map(ds => ({
                    label: ds.label,
                    data: ds.data,
                    backgroundColor: ds.color + '80',
                    borderColor: ds.color,
                    borderWidth: 1,
                    borderRadius: 4
                  }))
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { font: { family: 'Vazirmatn' } } } },
                  scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                  }
                }
              });
            });
          }, 500);
        },

        gasCall(functionName, ...args) {
          return new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args);
          });
        }
      }
    }
  </script>
</body>
</html>
