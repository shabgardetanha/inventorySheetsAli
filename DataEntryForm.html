<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ثبت عملیات ERP</title>
  <style>
    :root { 
      --primary: #2563eb; 
      --primary-hover: #1d4ed8; 
      --bg: #f1f5f9; 
      --card-bg: #ffffff; 
      --text: #0f172a; 
      --text-muted: #64748b; 
      --border: #e2e8f0; 
      --success: #10b981; 
      --error: #ef4444; 
    }
    * { box-sizing: border-box; }
    body { 
      font-family: Tahoma, 'Segoe UI', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 0; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
      min-height: 100vh; 
    }
    .app-container { 
      width: 100%; 
      max-width: 600px; 
      margin: 40px 20px; 
      background: var(--card-bg); 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); 
      overflow: hidden; 
    }
    .header { 
      background: var(--primary); 
      color: white; 
      padding: 24px; 
      text-align: center; 
    }
    .header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
    .header p { margin: 8px 0 0; opacity: 0.9; font-size: 0.9rem; }
    
    .form-body { padding: 32px 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; color: var(--text); }
    input, select { 
      width: 100%; 
      padding: 12px 16px; 
      border: 2px solid var(--border); 
      border-radius: 8px; 
      font-size: 1rem; 
      font-family: inherit;
      transition: all 0.2s; 
      background: #fafafa;
    }
    input:focus, select:focus { 
      outline: none; 
      border-color: var(--primary); 
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
    }
    
    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 1.1rem; 
      font-weight: 700; 
      cursor: pointer; 
      transition: background 0.2s; 
      margin-top: 10px; 
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .spinner { 
      width: 20px; height: 20px; 
      border: 3px solid rgba(255,255,255,0.3); 
      border-radius: 50%; 
      border-top-color: white; 
      animation: spin 0.8s linear infinite; 
      display: none; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .message { 
      margin-top: 20px; 
      padding: 16px; 
      border-radius: 8px; 
      text-align: center; 
      font-size: 0.95rem; 
      font-weight: 600;
      display: none; 
      animation: slideDown 0.3s ease-out;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    .footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>💎 پنل ثبت عملیات مالی</h1>
      <p>سیستم جامع ERP (نسخه تحت وب)</p>
    </div>
    
    <div class="form-body">
      <div class="form-group">
        <label for="txnType">نوع عملیات را انتخاب کنید:</label>
        <select id="txnType" onchange="loadFormFields()">
          <option value="">-- لطفاً انتخاب کنید --</option>
        </select>
      </div>

      <form id="dynamicForm" onsubmit="submitData(event)">
        <div id="fieldsContainer"></div>
        <button type="submit" class="btn-submit" id="submitBtn" disabled>
          <span class="spinner" id="spinner"></span>
          <span id="btnText">ثبت اطلاعات در سیستم</span>
        </button>
      </form>

      <div id="messageBox" class="message"></div>
    </div>
    
    <div class="footer">
      Powered by Google Apps Script Enterprise Engine v7.2
    </div>
  </div>

  <script>
    let formConfig = {};
    let existingItems = [];

    window.onload = function() {
      // نمایش حالت لودینگ اولیه
      document.getElementById('btnText').textContent = 'در حال بارگذاری پیکربندی...';
      google.script.run
        .withSuccessHandler(initUI)
        .withFailureHandler(err => showMsg('❌ خطا در بارگذاری: ' + err.message, 'error'))
        .getUiConfig();
    };

    function initUI(config) {
      formConfig = config.forms;
      existingItems = config.items;
      
      const typeSelect = document.getElementById('txnType');
      Object.keys(formConfig).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = formConfig[key].label;
        typeSelect.appendChild(option);
      });
      document.getElementById('btnText').textContent = 'ثبت اطلاعات در سیستم';
    }

    function loadFormFields() {
      const type = document.getElementById('txnType').value;
      const container = document.getElementById('fieldsContainer');
      const submitBtn = document.getElementById('submitBtn');
      container.innerHTML = '';
      document.getElementById('messageBox').style.display = 'none';
      
      if (!type) {
        submitBtn.disabled = true;
        return;
      }
      submitBtn.disabled = false;

      const fields = formConfig[type].fields;
      fields.forEach(field => {
        const group = document.createElement('div');
        group.className = 'form-group';
        
        const label = document.createElement('label');
        label.textContent = field.label + (field.required ? ' *' : '');
        group.appendChild(label);

        let input;
        if (field.type === 'select' && field.options) {
          input = document.createElement('select');
          input.id = field.name;
          input.required = field.required;
          input.innerHTML = '<option value="">انتخاب...</option>';
          field.options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            input.appendChild(option);
          });
        } else if (field.type === 'datalist') {
          input = document.createElement('input');
          input.type = 'text';
          input.id = field.name;
          input.required = field.required;
          input.setAttribute('list', field.name + '_list');
          input.setAttribute('autocomplete', 'off');
          input.placeholder = 'تایپ کنید یا انتخاب نمایید...';
          
          const datalist = document.createElement('datalist');
          datalist.id = field.name + '_list';
          existingItems.forEach(item => {
            const option = document.createElement('option');
            option.value = item;
            datalist.appendChild(option);
          });
          group.appendChild(input);
          group.appendChild(datalist);
        } else {
          input = document.createElement('input');
          input.type = field.type || 'text';
          input.id = field.name;
          input.required = field.required;
          if (field.type === 'number') input.step = 'any';
          group.appendChild(input);
        }
        container.appendChild(group);
      });
    }

    function submitData(e) {
      e.preventDefault();
      const type = document.getElementById('txnType').value;
      const fields = formConfig[type].fields;
      const formData = { type: formConfig[type].sheetName };

      fields.forEach(field => {
        formData[field.name] = document.getElementById(field.name).value;
      });

      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      
      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'در حال پردازش...';

      google.script.run
        .withSuccessHandler(() => {
          showMsg('✅ عملیات با موفقیت در سیستم ثبت گردید.', 'success');
          document.getElementById('dynamicForm').reset();
          document.getElementById('txnType').value = '';
          document.getElementById('fieldsContainer').innerHTML = '';
          btn.disabled = true;
          resetBtn();
        })
        .withFailureHandler((err) => {
          showMsg('❌ خطا: ' + err.message, 'error');
          resetBtn();
        })
        .processFormData(formData);
    }

    function resetBtn() {
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnText').textContent = 'ثبت اطلاعات در سیستم';
    }

    function showMsg(text, type) {
      const msgBox = document.getElementById('messageBox');
      msgBox.textContent = text;
      msgBox.className = 'message ' + type;
      msgBox.style.display = 'block';
      setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
    }
  </script>
</body>
</html>
